<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>לוח להצגה | השמחה שבאופק</title>
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2a44; --navy-soft: #2e4a6b; --teal: #2e8b8b; --gold: #c9a84a;
    --ink: #10243a; --soft: #5b6b7a; --line: #e3ebf0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Heebo", Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #f3f8fc 0%, #e7eff6 60%, #dde8f1 100%);
    color: var(--ink);
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* ===== סרגל עליון ===== */
  .tv-top {
    display: flex; align-items: center; gap: 2vw;
    padding: 1.6vh 2.4vw; background: linear-gradient(90deg, var(--navy), var(--navy-soft));
    color: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.18);
  }
  .tv-top img { height: 7.5vh; }
  .tv-brand { flex: 1; }
  .tv-brand h1 { margin: 0; font-size: 3.1vh; font-weight: 800; }
  .tv-brand p { margin: .3vh 0 0; font-size: 2vh; opacity: .85; font-weight: 500; }
  .tv-clock { text-align: center; }
  .tv-clock .time { font-size: 6.2vh; font-weight: 900; line-height: 1; direction: ltr; letter-spacing: 1px; }
  .tv-clock .greg { font-size: 1.9vh; opacity: .9; margin-top: .4vh; }
  .tv-clock .heb { font-size: 1.9vh; opacity: .9; }
  /* ===== גוף: שתי עמודות ===== */
  .tv-body { flex: 1; display: grid; grid-template-columns: 1.05fr 1fr; gap: 0; min-height: 0; }
  .tv-col { padding: 2.2vh 2.4vw; display: flex; flex-direction: column; min-height: 0; }
  .tv-col.left { background: rgba(255,255,255,.55); border-inline-start: 4px solid var(--gold); }
  .tv-col h2 {
    margin: 0 0 1.6vh; font-size: 3.2vh; color: var(--navy); text-align: center;
    padding-bottom: 1vh; border-bottom: 3px solid var(--teal); font-weight: 800;
  }
  /* ---- ותיקין היומי (עמודה שמאל) ---- */
  .vatikin-box { text-align: center; margin: 1vh 0 2.2vh; }
  .vatikin-box .lead { font-size: 2.4vh; color: var(--soft); font-weight: 600; }
  .vatikin-box .big { font-size: 11vh; font-weight: 900; color: var(--teal); line-height: 1; direction: ltr; }
  .vatikin-box .sub { font-size: 2.3vh; color: var(--ink); margin-top: .6vh; }
  .vatikin-box .sub .hanetz { color: var(--gold); font-weight: 800; direction: ltr; display: inline-block; }
  .vatikin-box.noon { }
  .vatikin-box .no-vatikin { font-size: 4.5vh; font-weight: 800; color: var(--navy-soft); }
  /* ---- רשימות ---- */
  .tv-list { list-style: none; margin: 0; padding: 0; flex: 1; }
  .tv-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.35vh 1vw; font-size: 2.9vh; border-bottom: 1.5px dashed var(--line);
  }
  .tv-list li:last-child { border-bottom: none; }
  .tv-list li .lbl { font-weight: 600; }
  .tv-list li .tm { font-weight: 800; color: var(--navy); direction: ltr; font-size: 3.1vh; }
  .tv-list li.note { justify-content: center; font-size: 2vh; font-style: italic; color: var(--soft); border-bottom: none; padding: .6vh 0; }
  /* ---- כותרת שבת + כניסה/יציאה ---- */
  .shabbat-head { text-align: center; margin-bottom: 1.4vh; }
  .shabbat-head .parasha { font-size: 3.4vh; font-weight: 800; color: var(--navy); }
  .candles { display: flex; justify-content: center; gap: 2.4vw; margin-top: 1vh; }
  .candles .c { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 1vh 1.6vw; min-width: 11vw; }
  .candles .c .k { font-size: 2vh; color: var(--soft); font-weight: 600; }
  .candles .c .v { font-size: 4.4vh; font-weight: 900; color: var(--ink); direction: ltr; line-height: 1.1; }
  .candles .c.in { border-color: var(--gold); }
  .candles .c.out { border-color: var(--teal); }
  .tv-foot { text-align: center; padding: 1vh; font-size: 1.7vh; color: var(--soft); background: rgba(255,255,255,.5); }
  .weekday-title { font-size: 2.5vh; font-weight: 700; color: var(--navy-soft); margin: 1.4vh 0 .6vh; text-align: center; }
</style>
</head>
<body>

<div class="tv-top">
  <img src="images/logo.png" alt="לוגו">
  <div class="tv-brand">
    <h1>בית הכנסת "השמחה שבאופק"</h1>
    <p>קהילת אוהב ישראל · נתיבות</p>
  </div>
  <div class="tv-clock">
    <div class="time" id="live-clock">--:--</div>
    <div class="greg" id="greg-date"></div>
    <div class="heb" id="heb-date"></div>
  </div>
</div>

<div class="tv-body">
  <!-- עמודה שמאל: זמני היום -->
  <div class="tv-col left">
    <h2 id="today-title">זמני היום</h2>
    <div class="vatikin-box" id="vatikin-box"></div>
    <div class="weekday-title">תפילות ימי חול</div>
    <ul class="tv-list" id="weekday-list-tv"></ul>
  </div>

  <!-- עמודה ימין: לוז השבת -->
  <div class="tv-col right">
    <h2>לוז שבת קודש</h2>
    <div class="shabbat-head">
      <div class="parasha" id="parasha-title">שבת שלום</div>
      <div class="candles">
        <div class="c in"><div class="k">כניסת שבת</div><div class="v" id="candle-time">--:--</div></div>
        <div class="c out"><div class="k">צאת שבת</div><div class="v" id="shabbat-end-time">--:--</div></div>
      </div>
    </div>
    <ul class="tv-list" id="shabbat-prayers-list"></ul>
  </div>
</div>

<div class="tv-foot">
  רח' קטיף 36, נתיבות · הזמנים מחושבים לפי אופק נתיבות · העמוד מתעדכן אוטומטית
</div>

<script src="js/netz-data.js?v=20"></script>
<script src="js/zmanim.js?v=20"></script>
<script src="js/shabbat-times-config.js?v=20"></script>
<script>
  // רישום Service Worker (רשת-תחילה) - כדי שרענון מלא ימשוך תמיד את התוכן העדכני
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  }

  // עותק "חי" של הגדרות זמני שבת - מתעדכן ברענון התוכן הקל (בלי טעינת עמוד מלאה),
  // כדי לחסוך בנתונים (לא מורידים מחדש לוגו/גופנים/קוד כל פעם - רק קובץ קטן).
  let liveShabbatCfg = (typeof SHABBAT_TIMES_CONFIG !== "undefined") ? SHABBAT_TIMES_CONFIG : null;

  const israelClock = new Intl.DateTimeFormat("he-IL", {
    timeZone: NETIVOT.timeZone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  });

  function renderClock() {
    document.getElementById("live-clock").textContent = israelClock.format(new Date());
  }

  function renderDates() {
    const now = new Date();
    document.getElementById("greg-date").textContent = formatGregorian(now);
    document.getElementById("heb-date").textContent = formatHebrewDate(now);
  }

  // זמני היום (ותיקין) - בעמודה השמאלית, גדול ובולט
  function renderToday() {
    const now = new Date();
    const { hanetz, tefila } = getShulZmanim(now);
    const { isShabbat, isYomTov, yomTovName, fixedTefilaTime, fixedTefilaName } = getDayStatus(now);
    const box = document.getElementById("vatikin-box");
    if (fixedTefilaTime) {
      box.innerHTML = `<div class="lead">תחילת התפילה (${fixedTefilaName})</div>
        <div class="big">${fixedTefilaTime}</div>
        <div class="sub">הנץ החמה <span class="hanetz">${formatTime(hanetz)}</span></div>`;
    } else if (isShabbat || isYomTov) {
      box.innerHTML = `<div class="no-vatikin">אין מניין ותיקין<br>(${isYomTov ? yomTovName : "שבת"})</div>
        <div class="sub" style="margin-top:1.4vh">הנץ החמה <span class="hanetz">${formatTime(hanetz)}</span></div>`;
    } else {
      box.innerHTML = `<div class="lead">תחילת תפילת ותיקין (הודו)</div>
        <div class="big">${formatTime(tefila)}</div>
        <div class="sub">הנץ החמה <span class="hanetz">${formatTime(hanetz)}</span></div>`;
    }
  }

  // לוז השבת (כניסה/יציאה + זמני תפילות) - מאותו מקור כמו דף השבת, דרך העותק החי
  function renderShabbat() {
    const t = calcShabbatTimes(new Date());
    if (!t) return;
    const computed = shabbatComputedValues(t);
    const cfg = liveShabbatCfg;
    document.getElementById("candle-time").textContent = (cfg && cfg.candleLighting.override) || computed.candleLighting;
    document.getElementById("shabbat-end-time").textContent = (cfg && cfg.shabbatEnds.override) || computed.shabbatEnds;
    if (cfg) {
      document.getElementById("shabbat-prayers-list").innerHTML = cfg.rows
        .filter((r) => !r.hidden)
        .map((r) => ({ label: r.label, time: r.override || computed[r.key] || "" }))
        .map((r) => `<li><span class="lbl">${r.label}</span><span class="tm">${r.time}</span></li>`)
        .join("");
    }
  }

  // תפילות ימי חול - נמשכות מדף השבת (weekday-list) כדי להישאר מסונכרן עם עריכות הניהול
  async function renderWeekday() {
    try {
      const resp = await fetch("shabbat.html?t=" + Date.now(), { cache: "reload" });
      const html = await resp.text();
      const m = html.match(/<ul class="shabbat-list" id="weekday-list">([\s\S]*?)<\/ul>/);
      if (!m) return;
      const tmp = document.createElement("div");
      tmp.innerHTML = m[1];
      const items = Array.from(tmp.querySelectorAll("li")).map((li) => {
        const isNote = li.classList.contains("note-line");
        const lbl = li.querySelector("span")?.textContent || "";
        const tm = li.querySelector(".time")?.textContent || "";
        return isNote
          ? `<li class="note">${lbl}</li>`
          : `<li><span class="lbl">${lbl}</span><span class="tm">${tm}</span></li>`;
      });
      document.getElementById("weekday-list-tv").innerHTML = items.join("");
    } catch (e) { /* נשאר ריק אם אין רשת */ }
  }

  // רענון תוכן "קל" (חוסך נתונים): מושך רק את קובץ ההגדרות הקטן ואת לוז ימי החול +
  // שם הפרשה - בלי לטעון מחדש את כל העמוד (לוגו/גופנים/קוד). רץ כל 30 דק'.
  async function refreshContent() {
    try {
      const r = await fetch("js/shabbat-times-config.js?t=" + Date.now(), { cache: "reload" });
      const txt = await r.text();
      const m = txt.match(/SHABBAT_TIMES_CONFIG\s*=\s*(\{[\s\S]*?\n\});/);
      if (m) liveShabbatCfg = Function(`"use strict"; return (${m[1]});`)();
    } catch (e) { /* שומרים על ההגדרות הקיימות */ }
    await renderWeekday();
    if (typeof renderParashaName === "function") renderParashaName();
    renderShabbat();
  }

  function renderLive() {
    renderDates();
    renderToday();
    renderShabbat();
  }

  renderClock();
  renderLive();
  refreshContent(); // משיכת תוכן ראשונית (פרשה, ימי חול, הגדרות)

  setInterval(renderClock, 1000);                      // שעון חי - בלי רשת
  setInterval(renderLive, 60 * 1000);                  // חישוב מחדש כל דקה (מעבר יום/שבת) - בלי רשת
  setInterval(refreshContent, 30 * 60 * 1000);         // רענון תוכן קל כל 30 דק' (~16KB)
  setInterval(() => location.reload(), 24 * 60 * 60 * 1000); // רענון מלא פעם ביום (עדכוני קוד)
</script>
</body>
</html>
